# ==========================================
# 主题配置 [Theme]
# ==========================================
[project.theme]
variant = "modern"                # Zensical 特有：使用 modern 主题变体（或 "classic"）
custom_dir = "docs/overrides"     # 自定义主题目录（相对于配置文件）
logo = "https://i.stardots.io/chenxin2026/StarDots-2026072222340888512.png"  # 网站 Logo
favicon = "https://i.stardots.io/chenxin2026/StarDots-2026072222340888512.png"          # 网站图标
language = "zh"                   # 网站语言：中文

# ===== 主题特性 =====
features = [
    # 导航相关
    "announce.dismiss",           # 可关闭公告栏
    "navigation.tracking",        # 滚动时URL锚点自动更新
    "navigation.tabs",            # 一级导航显示为顶部Tab
    "navigation.sections",        # 侧边栏分组
    "navigation.top",             # 返回顶部按钮
    "navigation.footer",          # 上一页/下一页导航
    # "navigation.expand",          # 默认展开导航
    "navigation.indexes",         # 章节索引页
    "navigation.instant",         # 即时导航
    "navigation.instant.prefetch",  # 预加载
    # "navigation.path",           # 导航路径

    # 搜索相关
    "search.suggest",             # 搜索建议
    "search.highlight",           # 搜索结果高亮
    "search.share",               # 搜索结果分享

    # 目录相关
    "toc.follow",                 # 目录跟随滚动

    # 内容相关
    "content.tooltips",           # 内容提示框
    "content.code.copy",          # 代码复制按钮
    # "content.code.select",        # 代码选择功能
    # "content.code.annotate",      # 代码注释功能
]

# ===== 调色板配置 =====
# 自动模式（跟随系统）
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "lucide/sun-moon", name = "关闭自动模式" }

# 日间模式
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"                # 日间模式配色
primary = "indigo"                # 主色调
accent = "indigo"                 # 强调色
toggle = { icon = "lucide/sun", name = "切换至夜间模式" }

# 夜间模式
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"                  # 夜间模式配色
primary = "indigo"                # 主色调
accent = "indigo"                 # 强调色
toggle = { icon = "lucide/moon", name = "切换至日间模式" }

# ===== 图标配置 =====
[project.theme.icon]
repo = "fontawesome/brands/github"          # 仓库图标
previous = "fontawesome/solid/angle-left"   # 上一页图标
next = "fontawesome/solid/angle-right"      # 下一页图标
alternate = "fontawesome/solid/language"    # 语言切换图标

# ==========================================
# 额外配置 [Extra]
# ==========================================
[project.extra]
generator = true

# ===== 状态标签 =====
[project.extra.status]
new = "最近添加"
deprecated = "已弃用"

# ===== 社交媒体链接 =====
# 显示在页脚的社交媒体图标
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/xinchen-sea/MY-ZJU-Summary"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/regular/envelope"
link = "https://www.cc98.org/user/id/732502"
name = "CC98"

# ==========================================
# 插件配置 [Plugins]
# ==========================================

# ===== 搜索插件 =====
[project.plugins.search]
separator = '[\s\u200b\-]'

# ===== 博客插件 =====
[project.plugins.blog]
post_date_format = "full"                    # 时间格式：完整日期
draft = true                                  # 启用草稿功能
draft_if_future_date = true                   # 自动将具有未来日期的帖子标记为草稿
post_readtime = true                          # 显示阅读时间
post_readtime_words_per_minute = 265          # 每分钟阅读字数（中文适配）
post_url_format = "{date}/{slug}"             # 文章URL格式
pagination_per_page = 10                      # 每页显示文章数
pagination_url_format = "page/{page}"         # 分页URL格式

# ===== 标签插件 =====
[project.plugins.tags]

# ==========================================
# Markdown 扩展配置 [Markdown Extensions]
# ==========================================

# ===== 官方默认配置（严格按照 Zensical 官方文档）=====
# ===== 基础扩展 =====
[project.markdown_extensions.abbr]          # 缩写支持
[project.markdown_extensions.admonition]    # 警告框（!!! note）
[project.markdown_extensions.attr_list]     # 属性列表
[project.markdown_extensions.def_list]      # 定义列表
[project.markdown_extensions.footnotes]     # 脚注支持
[project.markdown_extensions.md_in_html]    # HTML 中使用 Markdown
[project.markdown_extensions.toc]           # 目录生成
toc_depth = 4                               # 目录深度
permalink = true                            # 标题锚点链接

# ===== 数学公式支持 =====
[project.markdown_extensions."pymdownx.arithmatex"]
generic = true  # 使用 MathJax 渲染数学公式

# ===== 文本增强 =====
[project.markdown_extensions."pymdownx.betterem"]
smart_enable = "all"  # 智能斜体/粗体

[project.markdown_extensions."pymdownx.caret"]      # 上标 (^text^)
[project.markdown_extensions."pymdownx.mark"]      # 标记文本 (==text==)
[project.markdown_extensions."pymdownx.tilde"]     # 删除线 (~~text~~)

# ===== 交互元素 =====
[project.markdown_extensions."pymdownx.details"]   # 可折叠详情框
[project.markdown_extensions."pymdownx.tabbed"]    # 标签页
alternate_style = true
[project.markdown_extensions."pymdownx.tasklist"]  # 任务列表
custom_checkbox = true

# ===== 代码相关 =====
[project.markdown_extensions."pymdownx.highlight"]     # 代码高亮
[project.markdown_extensions."pymdownx.inlinehilite"] # 行内代码高亮
[project.markdown_extensions."pymdownx.superfences"]  # 代码块和 Mermaid

[project.markdown_extensions.pymdownx.blocks.caption] # 图注

# GLightbox 灯箱
[project.markdown_extensions.zensical.extensions.glightbox]
auto = true
auto_caption = true

# ===== 其他功能 =====
[project.markdown_extensions."pymdownx.keys"]         # 键盘按键 (++ctrl+alt+del++)
[project.markdown_extensions."pymdownx.smartsymbols"]  # 智能符号转换
[project.markdown_extensions."pymdownx.emoji"]        # Emoji 表情
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
